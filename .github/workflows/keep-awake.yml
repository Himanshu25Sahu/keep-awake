name: Keep Render Apps Awake (IST schedule, daily)

on:
  schedule:
    # 08:00–08:20 IST
    - cron: "30-50/10 2 * * *"

    # 08:30–09:50 IST
    - cron: "0-50/10 3 * * *"

    # 10:00–10:50 IST
    - cron: "0-50/10 4 * * *"

    # 11:00 IST
    - cron: "0 5 * * *"
  workflow_dispatch: # allows manual run

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoints
        run: |
          echo "Pinging endpoints to wake Render apps..."

          # List of endpoints (no commas)
          endpoints=(
            "https://tt-gateway.onrender.com/api/keepalive"
            "https://townsquare-kg8z.onrender.com/health"
            "https://tt-org-n09a.onrender.com/health"
            "https://tt-gateway-qs7u.onrender.com/health"
            "https://tt-entry.onrender.com/health"
            "https://tt-auth-1k43.onrender.com/health"
          )

          for url in "${endpoints[@]}"; do
            echo "Pinging $url"
            res=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 45 "$url") || res="000 0"
            echo "$(date -u +"%Y-%m-%d %H:%M:%S UTC") - $url => $res"
          done
